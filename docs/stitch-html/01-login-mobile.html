<!DOCTYPE html>

<html class="h-full" lang="es"><head>

                        "on-secondary-fixed-variant": "#603f33",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-full flex items-center justify-center font-body-md antialiased p-margin-mobile md:p-stack-lg">
<!-- Login Container -->
<main class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant p-stack-lg flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-base">
<!-- Brand Mark / Logo Placeholder -->
<div class="h-16 w-16 bg-primary-container rounded-full flex items-center justify-center mb-stack-sm shadow-sm shadow-primary/5">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    pets
                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">SIGA</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Sistema de Registro y Captación de Ganado
            </p>
</header>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="email">Correo Electrónico</label>
<div class="relative flex items-center h-touch-target-min bg-surface-container-lowest border border-outline rounded-lg focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-colors">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant pointer-events-none">
                        mail
                    </span>
<input class="w-full h-full pl-12 pr-4 bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant rounded-lg" id="email" name="email" placeholder="usuario@siga.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative flex items-center h-touch-target-min bg-surface-container-lowest border border-outline rounded-lg focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-colors">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant pointer-events-none">
                        lock
                    </span>
<input class="w-full h-full pl-12 pr-12 bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant rounded-lg" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar/Ocultar contraseña" class="absolute right-2 w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-on-surface focus:outline-none focus:ring-2 focus:ring-primary rounded-full transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">
                            visibility
                        </span>
</button>
</div>
</div>
<!-- Action Section -->
<div class="flex flex-col gap-stack-sm mt-base">
<button class="h-touch-target-min w-full bg-primary hover:bg-on-primary-fixed-variant active:scale-[0.98] text-on-primary font-button text-button rounded-lg flex items-center justify-center gap-2 transition-all duration-200 shadow-sm shadow-primary/10" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">
                        login
                    </span>
                    Iniciar Sesión
                </button>
<!-- Error Message Container (Visible for this requirement) -->
<div class="flex items-center gap-2 text-error mt-base px-2">
<span class="material-symbols-outlined text-[16px] shrink-0" style="font-variation-settings: 'FILL' 1;">
                        error
                    </span>
<p class="font-body-md text-body-md m-0">
                        Correo o contraseña incorrectos
                    </p>
</div>
</div>
</form>
</main>
<script>
        // Simple script to handle password visibility toggle
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.querySelector('button[aria-label="Mostrar/Ocultar contraseña"]');
            const passwordInput = document.getElementById('password');
            const visibilityIcon = togglePasswordBtn.querySelector('.material-symbols-outlined');

            if(togglePasswordBtn && passwordInput && visibilityIcon) {
                togglePasswordBtn.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                });
            }
        });
    </script>
</body></html>
