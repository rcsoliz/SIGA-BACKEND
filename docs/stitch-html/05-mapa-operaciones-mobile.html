<script>
        // Simple JS for interaction demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const mapOverlay = document.querySelector('.bg-gradient-to-t');
            const bottomSheet = document.querySelector('.transform.transition-transform');
            
            // Allow bottom sheet to be swiped down (simulated logic)
            let touchStartY = 0;
            
            bottomSheet.addEventListener('touchstart', e => {
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: true});
            
            bottomSheet.addEventListener('touchend', e => {
                const touchEndY = e.changedTouches[0].screenY;
                if (touchEndY - touchStartY > 50) {
                    // Swipe down detected - slide out
                    bottomSheet.classList.add('translate-y-[120%]');
                }
            }, {passive: true});

            // Tap map to hide sheet
            mapOverlay.addEventListener('click', () => {
                 bottomSheet.classList.add('translate-y-[120%]');
            });

            // Tap active marker to show sheet
            const activeMarker = document.querySelector('.cursor-pointer');
            activeMarker.addEventListener('click', () => {
                bottomSheet.classList.remove('translate-y-[120%]');
            });
        });
    </script>
