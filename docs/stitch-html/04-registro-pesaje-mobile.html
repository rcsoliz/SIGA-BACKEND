<body class="bg-background text-on-background font-body-md min-h-screen pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="flex justify-between items-center h-16 px-margin-mobile w-full z-50 bg-surface shadow-sm docked full-width top-0 sticky">
<button aria-label="Sincronizar" class="hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100 p-2 rounded-full text-primary">
<span class="material-symbols-outlined">sync</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary">SIGA</h1>
<button aria-label="Estado de conexión" class="hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100 p-2 rounded-full text-primary">
<span class="material-symbols-outlined">wifi</span>
</button>
</header>
<!-- Page Context Header -->
<div class="px-margin-mobile py-stack-md bg-surface-container-lowest border-b border-surface-variant mb-stack-md sticky top-16 z-40">
<h2 class="font-headline-md text-headline-md text-on-surface">Registro de Pesaje</h2>
</div>
<main class="px-margin-mobile flex flex-col gap-stack-lg pb-10">
<!-- SECTION 1: Formulario -->
<section class="flex flex-col gap-stack-md bg-surface-container-lowest p-margin-mobile rounded-lg shadow-sm border border-outline-variant">
<!-- Select: Captación -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="captacion">Captación</label>
<div class="relative w-full h-touch-target-min">
<select class="w-full h-full bg-surface-container-lowest border border-outline-variant rounded px-4 py-2 text-body-lg text-on-surface appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="captacion">
<option disabled="" selected="" value="">Seleccione un origen...</option>
<option value="1">Lote Norte 2024 - Hacienda El Vergel</option>
<option value="2">Sector Sur - Prado Alto</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<!-- Input: Fecha (Obligatorio) -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="fecha">Fecha del Pesaje *</label>
<div class="relative w-full h-touch-target-min">
<input class="w-full h-full bg-surface-container-lowest border border-outline-variant rounded px-4 py-2 text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none" id="fecha" required="" type="date" value="2024-05-15"/>
</div>
</div>
<!-- Input: Peso (Obligatorio) -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="peso">Peso Promedio (Kg) *</label>
<input class="w-full h-touch-target-min bg-surface-container-lowest border border-outline-variant rounded px-4 py-2 text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none placeholder:text-on-surface-variant/50" id="peso" placeholder="Ej: 420.5" required="" step="0.1" type="number"/>
</div>
<!-- Input: Cantidad (Opcional) -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="cantidad">Cantidad de Cabezas Pesadas</label>
<input class="w-full h-touch-target-min bg-surface-container-lowest border border-outline-variant rounded px-4 py-2 text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none placeholder:text-on-surface-variant/50" id="cantidad" placeholder="Ej: 45" type="number"/>
</div>
<!-- Textarea: Observaciones (Opcional) -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="observaciones">Observaciones</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded px-4 py-3 text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none placeholder:text-on-surface-variant/50" id="observaciones" placeholder="Añadir notas opcionales..." rows="3"></textarea>
</div>
<!-- Botón Submit -->
<button class="w-full h-touch-target-min mt-stack-sm bg-primary text-on-primary font-button text-button rounded shadow-sm hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined">save</span>
                Registrar Pesaje
            </button>
</section>
<!-- SECTION 2: Historial -->
<section class="flex flex-col gap-stack-md mt-stack-sm">
<div class="flex items-center justify-between border-b border-surface-variant pb-2">
<h3 class="font-headline-md text-headline-md text-on-surface">Historial de Pesajes</h3>
<span class="material-symbols-outlined text-on-surface-variant">history</span>
</div>
<div class="flex flex-col gap-stack-sm">
<!-- Tarjeta 1 -->
<div class="bg-surface-container-lowest p-margin-mobile rounded-lg border border-outline-variant shadow-sm flex flex-col gap-2 relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
<div class="flex justify-between items-start">
<span class="font-label-md text-label-md text-on-surface-variant">10/05/2024</span>
<span class="font-headline-md text-headline-md text-primary">420.5 Kg</span>
</div>
<div class="flex justify-between items-end mt-1">
<span class="text-body-md text-on-surface flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size: 18px;">pets</span> 
                            45 cab.
                        </span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant italic mt-2 border-t border-surface-variant/50 pt-2 text-sm">
                        "Control mensual rutinario"
                    </p>
</div>
<!-- Tarjeta 2 -->
<div class="bg-surface-container-lowest p-margin-mobile rounded-lg border border-outline-variant shadow-sm flex flex-col gap-2 relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-outline-variant"></div>
<div class="flex justify-between items-start">
<span class="font-label-md text-label-md text-on-surface-variant">12/04/2024</span>
<span class="font-headline-md text-headline-md text-on-surface">385.0 Kg</span>
</div>
<div class="flex justify-between items-end mt-1">
<span class="text-body-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size: 18px;">pets</span> 
                            —
                        </span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant italic mt-2 border-t border-surface-variant/50 pt-2 text-sm">
                        "Pesaje parcial de grupo"
                    </p>
</div>
<!-- Tarjeta 3 -->
<div class="bg-surface-container-lowest p-margin-mobile rounded-lg border border-outline-variant shadow-sm flex flex-col gap-2 relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-outline-variant"></div>
<div class="flex justify-between items-start">
<span class="font-label-md text-label-md text-on-surface-variant">15/03/2024</span>
<span class="font-headline-md text-headline-md text-on-surface">350.2 Kg</span>
</div>
<div class="flex justify-between items-end mt-1">
<span class="text-body-md text-on-surface flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size: 18px;">pets</span> 
                            45 cab.
                        </span>
</div>
</div>
</div>
</section>

<span class="font-label-md text-label-md mt-1">Ganado</span>
</button>
<!-- Tareas -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-150 w-16">
<span class="material-symbols-outlined">assignment</span>
<span class="font-label-md text-label-md mt-1">Tareas</span>
</button>
<!-- Perfil -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-150 w-16">
<span class="material-symbols-outlined">person</span>

</button>
