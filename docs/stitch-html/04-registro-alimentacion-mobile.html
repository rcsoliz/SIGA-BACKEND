<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Registro de Alimentación (Móvil) - ES Final</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#c1ecd4",
                        "on-primary-fixed": "#002114",
                        "on-secondary-container": "#795548",
                        "primary": "#0f5238",
                        "surface-container-highest": "#e1e3e4",
                        "on-surface-variant": "#404943",
                        "inverse-surface": "#2e3132",
                        "surface-dim": "#d9dadb",
                        "primary-container": "#2d6a4f",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#bfc9c1",
                        "background": "#f8f9fa",
                        "on-background": "#191c1d",
                        "on-surface": "#191c1d",
                        "surface-tint": "#2c694e",
                        "on-secondary-fixed": "#2e150b",
                        "secondary": "#7a5649",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#a8e7c5",
                        "primary-fixed": "#b1f0ce",
                        "on-tertiary-fixed": "#002114",
                        "secondary-fixed-dim": "#ebbcac",
                        "tertiary": "#274f3d",
                        "tertiary-container": "#3f6754",
                        "on-tertiary-container": "#b8e3cb",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container": "#edeeef",
                        "secondary-container": "#fdcdbc",
                        "on-tertiary-fixed-variant": "#274e3d",
                        "outline": "#707973",
                        "surface-container-low": "#f3f4f5",
                        "tertiary-fixed-dim": "#a5d0b9",
                        "on-secondary-fixed-variant": "#603f33",
                        "on-primary-fixed-variant": "#0e5138",
                        "primary-fixed-dim": "#95d4b3",
                        "surface-variant": "#e1e3e4",
                        "surface": "#f8f9fa",
                        "surface-bright": "#f8f9fa",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#ffdbcf",
                        "inverse-primary": "#95d4b3",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e7e8e9",
                        "inverse-on-surface": "#f0f1f2",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "touch-target-min": "48px",
                        "base": "4px",
                        "margin-mobile": "16px",
                        "stack-sm": "8px",
                        "gutter-mobile": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "button": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "button": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg antialiased min-h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface dark:bg-on-surface-variant shadow-sm dark:shadow-none flex justify-between items-center px-margin-mobile h-[64px]">
<div class="flex items-center gap-2">
<span aria-hidden="true" class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="agriculture" data-weight="fill" style="font-variation-settings: 'FILL' 1;">agriculture</span>
<span class="font-headline-lg font-bold text-primary dark:text-primary-fixed-dim tracking-tight">SIGA</span>
</div>
<button aria-label="Sync" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-stack-md pb-[100px]">
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-md">Registrar Alimentación</h1>
<!-- Form Section -->
<section class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant p-stack-md mb-stack-lg">
<form class="flex flex-col gap-stack-md">
<!-- Captación -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="captacion">Captación</label>
<div class="relative">
<select class="w-full min-h-[48px] bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-on-surface font-body-md" id="captacion">
<option disabled="" selected="" value="">Seleccione una captación...</option>
<option value="1">Captación Norte A - Invernada</option>
<option value="2">Captación Sur B - Cría</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Fecha -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="fecha">Fecha</label>
<input class="w-full min-h-[48px] bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-on-surface font-body-md" id="fecha" type="date">
</div>
<!-- Sistema de Alimentación -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant uppercase mb-2">Sistema de Alimentación</label>
<div class="grid grid-cols-1 gap-gutter-mobile">
<!-- Option 1 -->
<label class="relative flex items-center p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-container/10 has-[:checked]:ring-1 has-[:checked]:ring-primary">
<input class="sr-only" name="sistema" type="radio" value="pastoreo_libre">
<span class="material-symbols-outlined text-primary mr-3" data-icon="grass">grass</span>
<span class="font-button text-button text-on-surface flex-1">Pastoreo Libre</span>
<span class="material-symbols-outlined text-primary opacity-0 transition-opacity peer-checked:opacity-100 check-icon" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<!-- Option 2 -->
<label class="relative flex items-center p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-container/10 has-[:checked]:ring-1 has-[:checked]:ring-primary">
<input class="sr-only" name="sistema" type="radio" value="semi_confinamiento">
<span class="material-symbols-outlined text-secondary mr-3" data-icon="fence">fence</span>
<span class="font-button text-button text-on-surface flex-1">Semi-Confinamiento</span>
<span class="material-symbols-outlined text-primary opacity-0 transition-opacity check-icon" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<!-- Option 3 -->
<label class="relative flex items-center p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-container/10 has-[:checked]:ring-1 has-[:checked]:ring-primary">
<input class="sr-only" name="sistema" type="radio" value="confinamiento">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="warehouse">warehouse</span>
<span class="font-button text-button text-on-surface flex-1">Confinamiento</span>
<span class="material-symbols-outlined text-primary opacity-0 transition-opacity check-icon" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
</div>
<style>
                        input[type="radio"]:checked ~ .check-icon { opacity: 1; }
                    </style>
</div>
<div class="grid grid-cols-2 gap-gutter-mobile">
<!-- Ración Base -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="racion">Ración Base (Kg/An)</label>
<input class="w-full min-h-[48px] bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-on-surface font-body-md" id="racion" placeholder="Opcional" step="0.1" type="number">
</div>
<!-- Suplemento -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="suplemento">Suplemento (Kg/An)</label>
<input class="w-full min-h-[48px] bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-on-surface font-body-md" id="suplemento" placeholder="Opcional" step="0.1" type="number">
</div>
</div>
<!-- Observaciones -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="observaciones">Observaciones</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-on-surface font-body-md resize-none" id="observaciones" placeholder="Opcional" rows="3"></textarea>
</div>
<!-- Submit Button -->
<button class="w-full min-h-[48px] bg-primary text-on-primary rounded-full font-button text-button shadow-sm hover:bg-surface-tint transition-colors active:scale-[0.98] mt-2 flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" data-icon="save">save</span>
                    Registrar Alimentación
                </button>
</form>
</section>
<!-- Historial Reciente -->
<section>
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="history">history</span>
                Historial Reciente
            </h2>
<div class="flex flex-col gap-stack-sm">
<!-- Card 1 -->
<article class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant p-4">
<div class="flex justify-between items-start mb-2">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant">24 Oct 2023</span>
<span class="font-button text-button text-on-surface">Captación Norte A</span>
</div>
<span class="inline-flex items-center gap-1 bg-tertiary-fixed text-on-tertiary-fixed px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]" data-icon="grass">grass</span>
                            Pastoreo Libre
                        </span>
</div>
<div class="grid grid-cols-2 gap-2 mt-3 bg-surface-container-low rounded-lg p-3">
<div class="flex flex-col">
<span class="text-[10px] text-on-surface-variant uppercase font-semibold">Ración Base</span>
<span class="font-body-md text-on-surface">—</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] text-on-surface-variant uppercase font-semibold">Suplemento</span>
<span class="font-body-md text-on-surface">0.5 kg</span>
</div>
</div>
</article>
<!-- Card 2 -->
<article class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant p-4">
<div class="flex justify-between items-start mb-2">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant">23 Oct 2023</span>
<span class="font-button text-button text-on-surface">Captación Sur B - Cría</span>
</div>
<span class="inline-flex items-center gap-1 bg-secondary-container text-on-secondary-container px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]" data-icon="fence">fence</span>
                            Semi-Conf.
                        </span>
</div>
<div class="grid grid-cols-2 gap-2 mt-3 bg-surface-container-low rounded-lg p-3">
<div class="flex flex-col">
<span class="text-[10px] text-on-surface-variant uppercase font-semibold">Ración Base</span>
<span class="font-body-md text-on-surface">Captación Sur B - Cría</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] text-on-surface-variant uppercase font-semibold">Suplemento</span>
<span class="font-body-md text-on-surface">Captación Sur B - Cría</span>
</div>
</div>
</article>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter-mobile h-[80px] pb-safe bg-surface-container dark:bg-surface-container-low shadow-[0_-1px_3px_rgba(0,0,0,0.04)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-all active:scale-90 duration-200 min-w-[64px] min-h-[48px] rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Inicio</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-200 min-w-[64px] min-h-[48px]">
<span class="material-symbols-outlined mb-1" data-icon="assignment" data-weight="fill" style="font-variation-settings: 'FILL' 1;">assignment</span>
<span class="font-label-md text-label-md">Registros</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-all active:scale-90 duration-200 min-w-[64px] min-h-[48px] rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="sync">sync</span>
<span class="font-label-md text-label-md">Sincro</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-all active:scale-90 duration-200 min-w-[64px] min-h-[48px] rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">Perfil</span>
</button>
</nav>


</body></html>
